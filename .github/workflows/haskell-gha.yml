name: CI

on:
  push:
    branches:
    - master
    - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fourmolu:
    name: Fourmolu
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    - uses: haskell-actions/run-fourmolu@v13
      with:
        version: '0.20.1.0'

  hlint:
    name: HLint
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    - uses: haskell-actions/hlint-setup@c04631035af0a6787c85e33b3ea0128b8568b590
      with:
        version: '3.10'

    - uses: haskell-actions/hlint-run@d009541bdae0b8492992416e665bb6df8a3b5cde
      with:
        fail-on: suggestion

  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
        - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        ghc:
        - '9.2'
        - '9.4'
        - '9.6'
        - '9.8'
        - '9.10'
        - '9.12'
        - '9.14'
    steps:
    - uses: actions/checkout@v7

    - name: Install the system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libpq-dev

    - name: Install the gold linker
      if: contains(fromJSON('["9.2","9.4"]'), matrix.ghc)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils-gold

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: '3.16.1.0'

    - name: Show the versions
      id: versions
      run: |
        ghc --version
        cabal --version
        echo "GHC ${{ steps.setup.outputs.ghc-version }}, cabal ${{ steps.setup.outputs.cabal-version }}, image $ImageOS $ImageVersion" >> "$GITHUB_STEP_SUMMARY"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

    - name: Unpack the source tarballs
      run: |
        shopt -s extglob
        cabal sdist all --output-directory="$RUNNER_TEMP"/haskell-gha-sdist
        mkdir "$RUNNER_TEMP"/haskell-gha
        for f in cabal.project cabal.project.freeze cabal.project.local; do
          if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP"/haskell-gha; fi
        done
        tar -xzf "$RUNNER_TEMP"/haskell-gha-sdist/hpqtypes-+([0-9.]).tar.gz --strip-components=1 -C "$RUNNER_TEMP"/haskell-gha

    - name: Configure the project
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cat >> cabal.project.local <<'EOF'
        jobs: 4
        tests: True
        benchmarks: True

        package hpqtypes
          ghc-options: -Werror
        EOF

    - name: Enable parallel module builds for the local packages
      if: contains(fromJSON('["9.2","9.4","9.6"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cat >> cabal.project.local <<'EOF'
        package hpqtypes
          ghc-options: -j4
        EOF

    - name: Enable the GHC job semaphore
      if: contains(fromJSON('["9.8","9.10","9.12","9.14"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        echo 'semaphore: True' >> cabal.project.local

    - name: Make the build plan
      id: plan
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all --dry-run
        echo "hash=$(sha256sum dist-newstyle/cache/plan.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v6
      id: cache
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ steps.versions.outputs.image }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ steps.plan.outputs.hash }}
        restore-keys: ${{ runner.os }}-${{ steps.versions.outputs.image }}-ghc-${{ steps.setup.outputs.ghc-version }}-

    - name: Build the dependencies
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all --only-dependencies

    - uses: actions/cache/save@v6
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all

    - name: Run the tests
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal test all --test-show-details=direct

    - name: Check the packages
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        failed=0
        check() {
          echo "Checking the package $1"
          (cd "$2" && cabal check) || { echo "::error::cabal check failed for the package $1"; failed=1; }
        }
        check hpqtypes .
        exit "$failed"

    - name: Build the documentation
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal haddock all --disable-documentation --haddock-all --haddock-for-hackage
