branches:
- master
fourmolu:
  enabled: true
  version: 0.21.0.0
hlint:
  enabled: true
  version: '3.10'
services:
  postgres:
    image: postgres:18
    env:
      POSTGRES_PASSWORD: postgres
    ports:
    - 5432:5432
    options: >-
      --health-cmd pg_isready
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5
hooks:
  # The test suites of hpqtypes and hpqtypes-extras would interfere with each
  # other in one database, so hpqtypes-extras gets its own.
  after-setup:
  - name: Create the database for the tests of hpqtypes-extras
    run: |
      docker exec ${{ job.services.postgres.id }} createdb -U postgres hpqtypes_extras
