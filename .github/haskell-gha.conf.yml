branches:
- master
apt:
- libpq-dev
services:
  postgres:
    image: postgres:18
    env:
      POSTGRES_PASSWORD: postgres
    ports:
    - 5432:5432
    options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
fourmolu:
  enabled: true
  version: 0.20.1.0
hlint:
  enabled: true
  version: '3.10'
